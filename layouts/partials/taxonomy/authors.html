<div class="authors">
    <i class="fa fa-user" aria-hidden="true"></i>
    {{- range $index, $el := . -}}
      {{- if gt $index 0 }}
        <span class="separator">•</span>
      {{- end }}
      <a href="{{ ( printf "authors/%s.html" ( . | urlize ) ) | relLangURL }}">{{ . }}</a>
    {{- end -}}
  </div>
