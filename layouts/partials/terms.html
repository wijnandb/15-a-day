<section class="container taxonomy">
  <header>
    <h1 class="title">
      <a class="title-link" href="{{ .Permalink | safeURL }}">
        {{- if eq .Kind "term" -}}
          {{- i18n .Data.Plural | title -}}
          {{- print ": " -}}
        {{- end -}}
        {{- i18n (lower .Title) | default .Title | title -}}
      </a>
    </h1>
  </header>
  {{ .Content }}
  <ul>
    {{ range (first 50 $.Site.Taxonomies.tags.ByCount) }}
    {{ $count := len .Pages }}
    <li><a href="/tags/{{ .Name | urlize }}.html">{{ .Name }}</a> <sup>{{ $count }}</sup></li>
    {{ end }}
  </ul>
</section>
