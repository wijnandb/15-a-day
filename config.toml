baseURL = "https://www.baretta.nl"
title = "15 minutes a day"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
paginate = 15
pygmentsStyle = "bw"
pygmentsCodeFences = true
pygmentsCodeFencesGuessSyntax = true
enableEmoji = true
# Enable Disqus comments
# disqusShortname = "yourdiscussshortname"
uglyURLs = true

[params]
author = "wijnandb"
description = "15 minutes of writing, every day"
keywords = "blog,developer,personal"
info = ["Full Stack DevOps", "Entrepreneur"]
avatarURL = "images/logo.png"
#gravatar = "wijnand@perceptum.nl"
footerContent = "Enter a text here."
dateFormat = "January 2, 2006"
hideFooter = false
hideCredits = false
hideCopyright = false
since = 2014
# Git Commit in Footer, uncomment the line below to enable it
commit = "https://github.com/wijnandb/<repo-name>/tree/"
# Right To Left, shift content direction for languagues such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 10
# Enable Twemoji
enableTwemoji = false
# Custom CSS
customCSS = []
# Custom SCSS
customSCSS = []
# Custom JS
customJS = []


[related]
  includeNewer = true
  threshold = 80
  toLower = true
[[related.indices]]
  name = 'keywords'
  weight = 100
[[related.indices]]
  name = 'date'
  weight = 10
[[related.indices]]
  name = 'tags'
  weight = 100
[[related.indices]]
  name = 'authors'
  weight = 80


